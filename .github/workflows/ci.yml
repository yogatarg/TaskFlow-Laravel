name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama kalau ada push baru di branch yang sama --
# tidak ada gunanya menunggu hasil dari kode yang sudah usang.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.4 adalah versi minimum di composer.json, 8.5 dipakai di mesin
        # pengembangan. Keduanya diuji supaya proyek tidak diam-diam bergantung
        # pada fitur yang belum ada di versi minimumnya.
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Test berjalan di SQLite in-memory (lihat phpunit.xml), bukan PostgreSQL,
          # jadi tidak perlu layanan database sama sekali.
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache dependensi Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan berkas .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pasang dependensi frontend
        run: npm ci

      - name: Build aset
        # Wajib: feature test merender Blade, dan direktif @vite gagal kalau
        # manifest hasil build belum ada. Sekalian memastikan build tidak rusak.
        run: npm run build

      - name: Jalankan test
        run: php artisan test

  style:
    name: Gaya penulisan (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Periksa gaya penulisan
        # --test hanya memeriksa, tidak mengubah berkas. Perbaiki secara lokal
        # dengan menjalankan `./vendor/bin/pint`.
        run: ./vendor/bin/pint --test

  docker:
    name: Build image produksi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Tidak di-push ke mana pun. Tujuannya memastikan image benar-benar bisa
          # dibangun, karena kalau Dockerfile rusak yang menemukannya adalah Render
          # saat deploy -- dan saat itu aplikasinya sudah telanjur mati.
          push: false
          load: true
          tags: taskflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Nyalakan kontainer
        # Build saja tidak membuktikan apa-apa soal runtime: kesalahan di
        # docker/entrypoint.sh, path Caddyfile, atau pengikatan port baru muncul
        # saat kontainer dijalankan.
        #
        # Berkas SQLite dibuat DI DALAM kontainer, bukan di-mount dari host --
        # berkas hasil bind-mount tidak bisa ditulis oleh proses di dalamnya
        # ("attempt to write a readonly database").
        #
        # --security-opt=no-new-privileges meniru pembatasan yang dipakai Render.
        # Tanpa ini CI meloloskan image yang ditolak Render: kernel menolak
        # menjalankan berkas yang punya file capability dalam mode tersebut, dan
        # binary FrankenPHP memang datang dengan cap_net_bind_service terpasang.
        run: |
          docker run --detach --name taskflow-ci --publish 8080:8080 \
            --security-opt=no-new-privileges \
            --entrypoint sh \
            --env PORT=8080 \
            --env APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env APP_URL=http://localhost:8080 \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=/tmp/ci.sqlite \
            --env DB_URL= \
            --env SESSION_DRIVER=database \
            --env CACHE_STORE=database \
            --env QUEUE_CONNECTION=sync \
            --env LOG_CHANNEL=stderr \
            --env SEED_ON_BOOT=true \
            taskflow:ci -c 'touch /tmp/ci.sqlite && exec entrypoint'

      - name: Tunggu health check menjawab
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up > /dev/null 2>&1; then
              echo "Health check menjawab setelah $((i * 2)) detik."
              exit 0
            fi
            sleep 2
          done
          echo "Kontainer tidak pernah siap dalam 60 detik."
          exit 1

      - name: Pastikan aplikasi benar-benar boot
        # /up tidak menyentuh apa pun: ia menjawab 200 bahkan kalau konfigurasi,
        # route, atau view gagal di-cache. Mengikuti '/' sampai halaman login
        # membuktikan Laravel boot penuh dan Blade benar-benar bisa dirender.
        run: |
          kode=$(curl -s -o /dev/null -w '%{http_code}' -L http://localhost:8080/)
          echo "GET / -> HTTP $kode"
          test "$kode" = "200"

      - name: Cetak log kontainer kalau ada yang gagal
        if: failure()
        run: docker logs taskflow-ci

      - name: Bersihkan
        if: always()
        run: docker rm -f taskflow-ci || true
