name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama kalau ada push baru di branch yang sama --
# tidak ada gunanya menunggu hasil dari kode yang sudah usang.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.4 adalah versi minimum di composer.json, 8.5 dipakai di mesin
        # pengembangan. Keduanya diuji supaya proyek tidak diam-diam bergantung
        # pada fitur yang belum ada di versi minimumnya.
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Test berjalan di SQLite in-memory (lihat phpunit.xml), bukan PostgreSQL,
          # jadi tidak perlu layanan database sama sekali.
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache dependensi Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan berkas .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pasang dependensi frontend
        run: npm ci

      - name: Build aset
        # Wajib: feature test merender Blade, dan direktif @vite gagal kalau
        # manifest hasil build belum ada. Sekalian memastikan build tidak rusak.
        run: npm run build

      - name: Jalankan test
        run: php artisan test

  style:
    name: Gaya penulisan (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Periksa gaya penulisan
        # --test hanya memeriksa, tidak mengubah berkas. Perbaiki secara lokal
        # dengan menjalankan `./vendor/bin/pint`.
        run: ./vendor/bin/pint --test

  docker:
    name: Build image produksi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Tidak di-push ke mana pun. Tujuannya hanya memastikan image benar-benar
          # bisa dibangun, karena kalau Dockerfile rusak yang menemukannya adalah
          # Render saat deploy -- dan saat itu aplikasinya sudah telanjur mati.
          push: false
          load: true
          tags: taskflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Jalankan kontainer dan pastikan aplikasi menyala
        run: |
          # Build saja tidak membuktikan apa-apa soal runtime: kesalahan di
          # entrypoint.sh atau path Caddyfile baru muncul saat dijalankan.
          # Di sini kontainer benar-benar dinyalakan memakai SQLite sementara,
          # lalu health check Laravel diketuk sampai menjawab.
          touch /tmp/ci.sqlite && chmod 666 /tmp/ci.sqlite

          docker run -d --name taskflow-ci -p 8080:8080             -v /tmp/ci.sqlite:/tmp/ci.sqlite             -e PORT=8080             -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"             -e APP_ENV=production             -e APP_DEBUG=false             -e APP_URL=http://localhost:8080             -e DB_CONNECTION=sqlite             -e DB_DATABASE=/tmp/ci.sqlite             -e DB_URL=             -e SESSION_DRIVER=database             -e CACHE_STORE=database             -e QUEUE_CONNECTION=sync             -e LOG_CHANNEL=stderr             taskflow:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up > /dev/null 2>&1; then
              echo "Health check menjawab."

              # Halaman depan harus mengalihkan tamu ke /login, bukan menampilkan
              # error 500 -- ini memastikan Laravel benar-benar bisa boot penuh,
              # bukan sekadar melayani route health check yang tidak menyentuh apa pun.
              kode=$(curl -s -o /dev/null -w '%{http_code}' -L http://localhost:8080/)
              echo "GET / -> HTTP $kode"
              [ "$kode" = "200" ] || { docker logs taskflow-ci; exit 1; }

              docker rm -f taskflow-ci > /dev/null
              exit 0
            fi
            sleep 2
          done

          echo "Kontainer tidak pernah siap dalam 60 detik. Log:"
          docker logs taskflow-ci
          exit 1
